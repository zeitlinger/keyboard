<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">A context-aware keyboard: base layer and after typing n</title>
  <desc id="desc">Two Ferris Sweep keyboard states. On the base layer n and l combine to g. After typing n, the thumb r key produces ng.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #263238; }
    .heading { font-size: 25px; font-weight: 700; }
    .sub { font-size: 15px; fill: #66747c; }
    .key { fill: #f1f4f5; stroke: #c5ced2; stroke-width: 2; }
    .label { font-size: 17px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .muted { fill: #f7f8f8; stroke: #dce2e4; }
    .highlight { fill: #d9eff0; stroke: #159a9c; stroke-width: 3; }
    .highlight2 { fill: #ffe3d1; stroke: #e26932; stroke-width: 3; }
    .badge { fill: #159a9c; }
    .badge2 { fill: #e26932; }
    .badgeText { fill: white; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .formula { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .footer { fill: #eef2f3; }
    .footerText { font-size: 17px; text-anchor: middle; fill: #46545a; }
    .attribution { font-size: 12px; fill: #829097; }
  </style>
  <rect width="1200" height="560" fill="white"/>
