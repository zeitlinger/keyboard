    </g>
    <g class="label"><text x="0" y="76">⎋</text><text x="48" y="56">x</text><text x="96" y="46">w</text><text x="374" y="46">✦</text><text x="422" y="56">✦</text><text x="0" y="124">s</text><text x="48" y="104">c</text><text x="96" y="94">n</text><text x="144" y="104">t</text><text x="326" y="104">a</text><text x="374" y="94">e</text><text x="422" y="104">i</text><text x="470" y="124">h</text><text x="48" y="152">f</text><text x="96" y="142">l</text><text x="144" y="152">d</text><text x="278" y="172">u</text><text x="326" y="152">o</text><text x="374" y="142">y</text></g>
