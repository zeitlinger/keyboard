<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="1040" viewBox="0 0 900 1040" role="img" aria-labelledby="title desc">
<title id="title">Base layout and the keyboard state after typing n</title>
<desc id="desc">The actual keyboard layout followed by the full context-specific state after typing n.</desc>
<style>
 text { font-family: Inter, Arial, sans-serif; fill: #263238; }
 .heading { font-size: 28px; font-weight: 700; text-anchor: middle; }
 .note { font-size: 18px; fill: #66747c; text-anchor: middle; }
 .footer { fill: #eef2f3; }
 .footerText { font-size: 19px; text-anchor: middle; fill: #46545a; }
 .attr { font-size: 13px; fill: #829097; text-anchor: end; }
</style>
<defs>
 <clipPath id="diagram"><rect x="0" y="0" width="900" height="350"/></clipPath>
</defs>
<rect width="900" height="1040" fill="white"/>
<text x="450" y="38" class="heading">The layout, then what changes after n</text>
<text x="450" y="67" class="note">Same keyboard geometry; the next press is context-sensitive</text>
<g transform="translate(84 82) scale(1.0)" clip-path="url(#diagram)"><rect width="732" height="350" fill="#242a31"/><image href="images/base-layer.png" x="0" y="0" width="732" height="395"/></g>
<path d="M450 445v48m0 0-12-16m12 16 12-16" fill="none" stroke="#8a999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(84 510)" clip-path="url(#diagram)"><rect width="732" height="350" fill="#242a31"/><image href="images/after-n.png" x="0" y="0" width="732" height="395"/></g>
<rect x="90" y="925" width="720" height="62" rx="12" class="footer"/>
<text x="450" y="953" class="footerText">After n, ordinary keys can take on new meanings</text>
<text x="450" y="978" class="footerText">— including the thumb r key producing “ng”.</text>
<text x="810" y="1022" class="attr"><a href="https://github.com/caksoylar/keymap-drawer">Generated with keymap-drawer</a></text>
</svg>
