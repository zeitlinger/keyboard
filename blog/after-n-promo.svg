  <text x="900" y="45" class="heading" text-anchor="middle">After typing n</text>
  <text x="300" y="72" class="sub" text-anchor="middle">the normal layout</text>
  <text x="900" y="72" class="sub" text-anchor="middle">the next press gets a new meaning</text>
  <path d="M548 220h104l-18-12m18 12-18 12" fill="none" stroke="#8a999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="board-base" transform="translate(46 100)">
    <!-- Ferris Sweep: three gently staggered rows, split around the centre -->
    <g class="muted">
      <rect x="0" y="55" width="42" height="42" rx="6"/><rect x="48" y="35" width="42" height="42" rx="6"/><rect x="96" y="25" width="42" height="42" rx="6"/><rect x="144" y="35" width="42" height="42" rx="6"/><rect x="192" y="55" width="42" height="42" rx="6"/>
      <rect x="278" y="55" width="42" height="42" rx="6"/><rect x="326" y="35" width="42" height="42" rx="6"/><rect x="374" y="25" width="42" height="42" rx="6"/><rect x="422" y="35" width="42" height="42" rx="6"/><rect x="470" y="55" width="42" height="42" rx="6"/>
      <rect x="0" y="103" width="42" height="42" rx="6"/><rect x="48" y="83" width="42" height="42" rx="6"/><rect x="96" y="73" width="42" height="42" rx="6"/><rect x="144" y="83" width="42" height="42" rx="6"/><rect x="192" y="103" width="42" height="42" rx="6"/>
      <rect x="278" y="103" width="42" height="42" rx="6"/><rect x="326" y="83" width="42" height="42" rx="6"/><rect x="374" y="73" width="42" height="42" rx="6"/><rect x="422" y="83" width="42" height="42" rx="6"/><rect x="470" y="103" width="42" height="42" rx="6"/>
      <rect x="0" y="151" width="42" height="42" rx="6"/><rect x="48" y="131" width="42" height="42" rx="6"/><rect x="96" y="121" width="42" height="42" rx="6"/><rect x="144" y="131" width="42" height="42" rx="6"/><rect x="192" y="151" width="42" height="42" rx="6"/>
